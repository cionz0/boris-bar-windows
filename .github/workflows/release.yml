name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install packaging tools
        run: choco install innosetup 7zip --no-progress -y

      - name: Publish and package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Set-ExecutionPolicy -Scope Process Bypass
          .\tools\publish.ps1 -All -Installer -Version $version

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/BorisBar-*-win-x64.zip
            publish/BorisBar-*-win-arm64.zip
            publish/BorisBar-*-win-x64-setup.exe
            publish/BorisBar-*-win-arm64-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
